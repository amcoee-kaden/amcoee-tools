<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta http-equiv="X-Frame-Options" content="DENY"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings — AMCOEE Tools</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ==" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/design-system.css"/>
  <link rel="stylesheet" href="css/owner-dashboard.css"/>
  <link rel="stylesheet" href="css/enhancements.css"/>
</head>
<body>
  <div id="app-shell"></div>
  <script src="js/event-bus.js"></script>
  <script src="js/data-store.js"></script>
  <script src="js/permission-guard.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/audit-log.js"></script>
  <script src="js/analytics-engine.js"></script>
  <script src="js/security-monitor.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/org-manager.js"></script>
  <script>
    const session = Shell.init({ pageId: 'settings', pageTitle: 'Settings' });
    const main = document.getElementById('main-body');
    if (main && session) {
      const isAdmin = session.role === 'owner' || session.role === 'head_admin';
      let activeTab = 'departments';

      function renderSettings() {
        const tabs = [
          { id: 'departments', label: 'Departments', admin: true },
          { id: 'groups',      label: 'Groups',      admin: true },
          { id: 'orgchart',    label: 'Org Chart',   admin: true },
          { id: 'data',        label: 'Data & Storage', admin: true },
        ];
        const visibleTabs = tabs.filter(t => !t.admin || isAdmin);

        main.innerHTML =
          '<div style="margin-bottom:24px">' +
            '<h2 style="font-size:var(--text-2xl);font-weight:800;color:var(--text-primary)">Settings</h2>' +
            '<p style="color:var(--text-secondary);font-size:var(--text-sm);margin-top:4px">Organization and system configuration</p>' +
          '</div>' +
          '<div style="display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border-primary)">' +
            visibleTabs.map(function(t) {
              var active = activeTab === t.id;
              return '<button class="btn btn-ghost btn-sm settings-tab" data-tab="' + t.id + '" style="' +
                (active ? 'color:var(--accent);border-bottom:2px solid var(--accent);border-radius:0' : '') +
                '">' + t.label + '</button>';
            }).join('') +
          '</div>' +
          '<div id="settings-content"></div>';

        main.querySelectorAll('.settings-tab').forEach(function(btn) {
          btn.addEventListener('click', function() {
            activeTab = btn.dataset.tab;
            renderSettings();
          });
        });

        var content = document.getElementById('settings-content');
        if (activeTab === 'departments') OrgManager.renderDepartments(content, session);
        else if (activeTab === 'groups') OrgManager.renderGroups(content, session);
        else if (activeTab === 'orgchart') OrgManager.renderOrgChart(content, session);
        else if (activeTab === 'data') renderDataSettings(content);
      }

      function renderDataSettings(container) {
        var usage = DataStore.getStorageUsage();
        container.innerHTML =
          '<div class="card" style="padding:24px;margin-bottom:16px">' +
            '<h3 style="font-weight:700;margin-bottom:16px">Storage Usage</h3>' +
            '<div style="display:grid;gap:12px">' +
              '<div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">localStorage</span><span style="font-family:monospace">' + usage.localStorageMB + ' MB (' + usage.localStoragePercent + '%)</span></div>' +
              '<div style="background:var(--bg-tertiary);border-radius:8px;height:8px;overflow:hidden"><div style="background:var(--accent);height:100%;width:' + Math.min(usage.localStoragePercent, 100) + '%;border-radius:8px;transition:width 0.5s"></div></div>' +
            '</div>' +
          '</div>' +
          '<div class="card" style="padding:24px">' +
            '<h3 style="font-weight:700;margin-bottom:16px">Data Management</h3>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
              '<button class="btn btn-primary btn-sm" id="btn-export-data">Export All Data</button>' +
              '<button class="btn btn-ghost btn-sm" id="btn-import-data">Import Data</button>' +
            '</div>' +
          '</div>';

        container.querySelector('#btn-export-data').addEventListener('click', async function() {
          var dump = await DataStore.exportAll();
          var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'amcoee-backup-' + new Date().toISOString().split('T')[0] + '.json';
          a.click();
          URL.revokeObjectURL(url);
          UI.toast('Data exported', 'success');
        });

        container.querySelector('#btn-import-data').addEventListener('click', function() {
          var input = document.createElement('input');
          input.type = 'file';
          input.accept = '.json';
          input.addEventListener('change', async function() {
            var file = input.files[0];
            if (!file) return;
            try {
              var text = await file.text();
              var data = JSON.parse(text);
              await DataStore.importAll(data);
              UI.toast('Data imported successfully', 'success');
              renderSettings();
            } catch (e) {
              UI.toast('Import failed: ' + e.message, 'error');
            }
          });
          input.click();
        });
      }

      renderSettings();
    }
  </script>
</body>
</html>
