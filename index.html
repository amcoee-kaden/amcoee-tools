  <style>
    /* ── Login wallpaper — soft pastel orbs over grouped-background base ── */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #F2F2F7;
    }

    /* Pastel wallpaper orbs — light-mode appropriate, soft */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      animation: none;
    }
    .orb-1 { width: 70vmax; height: 70vmax; background: radial-gradient(circle, rgba(0, 122, 255, 0.32), transparent 62%); top: -22vmax; left: -18vmax; opacity: 0.85; }
    .orb-2 { width: 60vmax; height: 60vmax; background: radial-gradient(circle, rgba(175, 82, 222, 0.26), transparent 62%); bottom: -18vmax; right: -12vmax; opacity: 0.80; }
    .orb-3 { width: 50vmax; height: 50vmax; background: radial-gradient(circle, rgba(255, 45, 85, 0.18), transparent 62%); top: 40%; left: 30%; opacity: 0.65; }
    .orb-4 { width: 45vmax; height: 45vmax; background: radial-gradient(circle, rgba(48, 176, 199, 0.22), transparent 62%); top: 8%; right: 14%; opacity: 0.70; }
    .orb-5 { width: 40vmax; height: 40vmax; background: radial-gradient(circle, rgba(255, 149, 0, 0.18), transparent 62%); bottom: 15%; left: 12%; opacity: 0.65; }

    .noise-overlay, .dot-grid { display: none; }

    /* ── Login card — real Liquid Glass with SVG refraction ─────────────── */
    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 28px;
      padding: 36px 32px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow:
        inset 0 0 42px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.90),
        inset 0 -1px 0 rgba(0, 0, 0, 0.06),
        inset 0 0 0 0.5px rgba(0, 0, 0, 0.05),
        0 34px 72px rgba(0, 0, 0, 0.22),
        0 12px 26px rgba(0, 0, 0, 0.12);
      animation: cardEntrance 520ms cubic-bezier(0.25, 1.05, 0.3, 1) both;
      animation-delay: 80ms;
      isolation: isolate;
      --sx: 50%;
      --sy: -15%;
    }

    /* Refraction layer — strong variant for the hero card */
    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      backdrop-filter: blur(56px) saturate(230%) brightness(1.10) contrast(1.04);
      -webkit-backdrop-filter: blur(56px) saturate(230%) brightness(1.10) contrast(1.04);
      filter: url(#lg-refract-strong);
      pointer-events: none;
      z-index: 0;
    }

    /* Specular sweep — bright wet highlight chases the cursor */
    .login-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--sx) var(--sy),
        rgba(255, 255, 255, 0.75) 0%,
        rgba(255, 255, 255, 0.22) 28%,
        transparent 60%
      );
      pointer-events: none;
      opacity: 0.55;
      transition: opacity 300ms cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 1;
      mix-blend-mode: overlay;
    }
    .login-card:hover::after { opacity: 1; }

    .login-card > * { position: relative; z-index: 2; }

    .card-reflection { display: none; }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card.idle-float { animation: none; }

    /* ── Logo ────────────────────────────────────────────────────────────── */
    .login-logo {
      text-align: center;
      margin-bottom: 26px;
    }

    .login-logo-icon {
      width: 56px; height: 56px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border-radius: 14px;
      background: #0A84FF;
      color: #fff;
      box-shadow:
        0 2px 8px rgba(10, 132, 255, 0.38),
        inset 0 0.5px 0 rgba(255, 255, 255, 0.30);
    }
    .login-logo-icon::before { display: none; }

    .login-logo h1 {
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.022em;
      color: rgba(0, 0, 0, 0.88);
    }

    .login-logo .tagline {
      color: rgba(60, 60, 67, 0.60);
      font-size: 13px;
      margin-top: 4px;
      font-weight: 400;
      letter-spacing: -0.008em;
      min-height: 1.4em;
    }
    .tagline .cursor-blink { display: none; }

    /* ── Select label ────────────────────────────────────────────────────── */
    .select-label {
      font-size: 12px;
      font-weight: 590;
      color: rgba(60, 60, 67, 0.60);
      letter-spacing: -0.005em;
      margin-bottom: 10px;
      display: block;
    }

    /* ── User selection rows (iOS Settings-style) ──────────────────────── */
    .login-users { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }

    .login-user-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(120, 120, 128, 0.08);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      color: rgba(0, 0, 0, 0.88);
      position: relative;
      transition: background 150ms cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .login-user-btn:hover  { background: rgba(120, 120, 128, 0.14); }
    .login-user-btn:active { background: rgba(120, 120, 128, 0.20); }

    .login-user-btn.selected {
      background: rgba(0, 122, 255, 0.14);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0 rgba(0, 0, 0, 0.04),
        inset 0 0 0 0.5px rgba(0, 122, 255, 0.42),
        0 1px 2px rgba(0, 122, 255, 0.10);
      isolation: isolate;
    }
    /* Refraction layer on selected pill — tinted liquid glass */
    .login-user-btn.selected::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      backdrop-filter: blur(20px) saturate(240%) brightness(1.08);
      -webkit-backdrop-filter: blur(20px) saturate(240%) brightness(1.08);
      filter: url(#lg-refract);
      pointer-events: none;
      z-index: -1;
      display: block;
    }
    .login-user-btn.selected .login-user-avatar { animation: none; }
    .login-user-btn.selected .login-user-name { color: #003E8F; font-weight: 600; }

    .login-user-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 11px;
      color: white;
      flex-shrink: 0;
      box-shadow:
        inset 0 0.5px 0 rgba(255, 255, 255, 0.30),
        0 1px 2px rgba(0, 0, 0, 0.14);
    }

    .login-user-info { flex: 1; min-width: 0; }
    .login-user-name { font-weight: 590; font-size: 14px; color: rgba(0, 0, 0, 0.88); letter-spacing: -0.008em; }
    .login-user-role { font-size: 11px; font-weight: 500; letter-spacing: 0; margin-top: 1px; text-transform: none; }

    .login-user-chevron { color: rgba(60, 60, 67, 0.30); }
    .login-user-btn:hover .login-user-chevron { color: rgba(60, 60, 67, 0.60); transform: none; }

    /* ── Step transitions ────────────────────────────────────────────────── */
    .step-container { position: relative; }
    .step-slide-out      { animation: stepOutLeft 260ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    .step-slide-in       { animation: stepInRight 320ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    .step-slide-back-out { animation: stepOutRight 260ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }
    .step-slide-back-in  { animation: stepInLeft 320ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards; }

    @keyframes stepOutLeft  { to   { opacity: 0; transform: translateX(-16px); } }
    @keyframes stepInRight  { from { opacity: 0; transform: translateX(16px); }  to { opacity: 1; transform: translateX(0); } }
    @keyframes stepOutRight { to   { opacity: 0; transform: translateX(16px); } }
    @keyframes stepInLeft   { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }

    /* ── PIN boxes ───────────────────────────────────────────────────────── */
    .pin-boxes { display: flex; gap: 8px; justify-content: center; margin: 20px 0 12px; }

    .pin-box {
      width: 44px; height: 52px;
      background: rgba(120, 120, 128, 0.12);
      border: none;
      border-radius: 10px;
      text-align: center;
      font-family: -apple-system, "SF Pro Display", sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.88);
      outline: none;
      caret-color: transparent;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.06);
      transition: background 150ms cubic-bezier(0.25, 0.8, 0.25, 1),
                  box-shadow 150ms cubic-bezier(0.25, 0.8, 0.25, 1);
      -webkit-text-security: disc;
      -moz-appearance: textfield;
    }
    .pin-box::-webkit-inner-spin-button, .pin-box::-webkit-outer-spin-button { -webkit-appearance: none; }

    .pin-box:focus {
      background: #FFFFFF;
      box-shadow:
        inset 0 0 0 1px #007AFF,
        0 0 0 3px rgba(0, 122, 255, 0.22);
    }

    .pin-box.filled {
      background: rgba(0, 122, 255, 0.10);
      box-shadow: inset 0 0 0 1px rgba(0, 122, 255, 0.40);
    }

    /* ── Back button ─────────────────────────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--accent, #0A84FF);
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      padding: 4px 0;
      margin-bottom: 14px;
      transition: opacity 150ms ease;
      letter-spacing: -0.01em;
    }
    .back-btn:hover   { opacity: 0.72; transform: none; }
    .back-btn:focus-visible { outline: 3px solid rgba(10, 132, 255, 0.28); outline-offset: 2px; border-radius: 4px; }

    /* ── Primary submit button — Liquid Glass pill ──────────────────────── */
    .login-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 24px;
      min-height: 42px;
      margin-top: 16px;
      border: none;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 590;
      letter-spacing: -0.01em;
      color: white;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #409CFF 0%, #0A84FF 55%, #0060DF 100%);
      box-shadow:
        inset 0 0.5px 0 rgba(255, 255, 255, 0.38),
        inset 0 -0.5px 0 rgba(0, 0, 0, 0.22),
        0 4px 12px rgba(10, 132, 255, 0.42),
        0 1px 0 rgba(0, 0, 0, 0.18);
      transition: filter 150ms cubic-bezier(0.25, 0.8, 0.25, 1),
                  transform 120ms cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .login-submit:hover:not(:disabled)  { filter: brightness(1.10); }
    .login-submit:active:not(:disabled) { filter: brightness(0.92); transform: scale(0.97); }
    .login-submit:disabled { opacity: 0.42; cursor: not-allowed; }
    .login-submit:focus-visible { outline: 3px solid rgba(10, 132, 255, 0.36); outline-offset: 2px; }

    .login-submit .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      transform: scale(0);
      animation: rippleAnim 500ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
      pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(3); opacity: 0; } }

    .login-submit.loading .btn-text { opacity: 0; }
    .login-submit.loading::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.30);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 600ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PIN user display ────────────────────────────────────────────────── */
    .pin-user-display { text-align: center; margin-bottom: 6px; }
    .pin-user-display .name {
      font-weight: 590;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: rgba(0, 0, 0, 0.88);
    }
    .pin-label {
      text-align: center;
      font-size: 12px;
      color: rgba(60, 60, 67, 0.60);
      font-weight: 400;
      letter-spacing: -0.005em;
      margin-bottom: 0;
    }

    /* ── Error / lockout ─────────────────────────────────────────────────── */
    .login-error {
      text-align: center;
      color: #FF3B30;
      font-size: 13px;
      font-weight: 500;
      margin-top: 10px;
      letter-spacing: -0.008em;
      opacity: 0;
      animation: errorIn 300ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }
    @keyframes errorIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lockout-message {
      text-align: center;
      padding: 10px 14px;
      background: rgba(255, 59, 48, 0.10);
      border: 0.5px solid rgba(255, 59, 48, 0.24);
      border-radius: 10px;
      color: #FF3B30;
      font-size: 13px;
      font-weight: 500;
      margin-top: 10px;
      letter-spacing: -0.008em;
      opacity: 0;
      animation: errorIn 300ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    .lockout-timer {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      color: rgba(255, 59, 48, 0.72);
      font-variant-numeric: tabular-nums;
    }

    .login-hint {
      text-align: center;
      color: rgba(60, 60, 67, 0.30);
      font-size: 11px;
      margin-top: 20px;
      font-weight: 400;
      letter-spacing: -0.003em;
    }

    /* ── Shake on wrong PIN ─────────────────────────────────────────────── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-5px); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .shake-it { animation: shake 400ms cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    .shake-it .pin-box {
      box-shadow: inset 0 0 0 1px rgba(255, 59, 48, 0.50) !important;
    }

    .login-card.success {
      transition: transform 300ms cubic-bezier(0.25, 0.8, 0.25, 1),
                  opacity 300ms cubic-bezier(0.25, 0.8, 0.25, 1);
      opacity: 0.6;
      transform: scale(0.98);
    }

    /* ── Scrollbar ───────────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.14); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.24); }

    *:focus-visible { outline: 3px solid rgba(10, 132, 255, 0.28); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .login-card { animation: none !important; opacity: 1; transform: none; }
    }

    /* ── Forgot PIN ──────────────────────────────────────────────────────── */
    .forgot-pin-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: var(--accent, #0A84FF);
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 0;
      transition: opacity 150ms ease;
      letter-spacing: -0.008em;
    }
    .forgot-pin-link:hover { opacity: 0.72; }

    #login-step-forgot { display: none; }

    .forgot-card {
      text-align: center;
      padding: 18px 16px;
      background: rgba(120, 120, 128, 0.08);
      border-radius: 14px;
    }

    .forgot-icon { font-size: 30px; margin-bottom: 10px; display: block; }
    .forgot-title {
      font-family: -apple-system, "SF Pro Display", sans-serif;
      font-size: 16px; font-weight: 590;
      letter-spacing: -0.016em;
      color: rgba(0, 0, 0, 0.88);
      margin-bottom: 4px;
    }
    .forgot-desc {
      font-size: 13px;
      color: rgba(60, 60, 67, 0.60);
      line-height: 1.5;
      letter-spacing: -0.008em;
      margin-bottom: 4px;
    }
    .forgot-email {
      display: inline-block;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent, #007AFF);
      margin-bottom: 16px;
      letter-spacing: -0.008em;
    }

    .forgot-success {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      background: rgba(52, 199, 89, 0.14);
      border: 0.5px solid rgba(52, 199, 89, 0.32);
      border-radius: 10px;
      color: #34C759;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
      letter-spacing: -0.008em;
      animation: errorIn 300ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }
    .forgot-success.visible { display: flex; }
  </style>
</head>
<body>

<!-- SVG filter defs: noise + Liquid Glass displacement refraction -->
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <!-- Liquid Glass: low-frequency turbulence + displacement map.
       feTurbulence generates an organic field; feDisplacementMap uses R/G
       channels of that field to offset the source pixels — this is the real
       "lensing" effect that bends light at the glass edges. -->
  <filter id="lg-refract" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="3" result="turb"/>
    <feGaussianBlur in="turb" stdDeviation="1.8" result="turbBlur"/>
    <feDisplacementMap in="SourceGraphic" in2="turbBlur" scale="8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- Stronger variant for large hero surfaces (login card, modal) -->
  <filter id="lg-refract-strong" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="turb"/>
    <feGaussianBlur in="turb" stdDeviation="2.5" result="turbBlur"/>
    <feDisplacementMap in="SourceGraphic" in2="turbBlur" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- ═══════════════════ LOGIN SCREEN ═══════════════════ -->
<div id="login-screen">
  <div class="login-wrapper">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="orb orb-5"></div>

    <div class="noise-overlay" style="filter:url(#noiseFilter)"></div>
    <div class="dot-grid"></div>

    <div class="login-card" id="login-card">
      <div class="card-reflection" id="card-reflection"></div>

      <div class="login-logo">
        <div class="login-logo-icon">&#x26A1;</div>
        <h1>AMCOEE Tools</h1>
        <p class="tagline" id="tagline"></p>
      </div>

      <div class="step-container">
        <div id="login-step-user">
          <span class="select-label">Select your account</span>
          <div class="login-users" id="user-list"></div>
        </div>

        <div id="login-step-pin" style="display:none">
          <button class="back-btn" id="back-to-users" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back
          </button>
          <div class="pin-user-display">
            <span class="name" id="pin-user-name"></span>
          </div>
          <p class="pin-label">Enter your 6-digit PIN</p>
          <div class="pin-boxes" id="pin-boxes">
            <input type="password" inputmode="numeric" autocomplete="off" class="pin-box" maxlength="1" data-index="0" aria-label="PIN digit 1"/>
            <input type="password" inputmode="numeric" autocomplete="off" class="pin-box" maxlength="1" data-index="1" aria-label="PIN digit 2"/>
            <input type="password" inputmode="numeric" autocomplete="off" class="pin-box" maxlength="1" data-index="2" aria-label="PIN digit 3"/>
            <input type="password" inputmode="numeric" autocomplete="off" class="pin-box" maxlength="1" data-index="3" aria-label="PIN digit 4"/>
            <input type="password" inputmode="numeric" autocomplete="off" class="pin-box" maxlength="1" data-index="4" aria-label="PIN digit 5"/>
            <input type="password" inputmode="numeric" autocomplete="off" class="pin-box" maxlength="1" data-index="5" aria-label="PIN digit 6"/>
          </div>
          <div id="login-error" class="login-error" style="display:none"></div>
          <div id="lockout-msg" class="lockout-message" style="display:none">
            <span id="lockout-text"></span>
            <span class="lockout-timer" id="lockout-timer"></span>
          </div>
          <button class="login-submit" id="login-btn" type="button" disabled>
            <span class="btn-text">Sign In</span>
          </button>
          <button class="forgot-pin-link" id="forgot-pin-link" type="button">Forgot PIN?</button>
        </div>

        <div id="login-step-forgot">
          <button class="back-btn" id="back-to-pin" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Back to login
          </button>
          <div class="forgot-card">
            <span class="forgot-icon">🔐</span>
            <div class="forgot-title">Reset Your PIN</div>
            <p class="forgot-desc">Contact your administrator to reset your PIN</p>
            <a class="forgot-email" href="mailto:kaden@amcoee.com">kaden@amcoee.com</a>
            <br/>
            <button class="login-submit" id="request-reset-btn" type="button" style="margin-top:16px">
              <span class="btn-text">Request Reset</span>
            </button>
            <div class="forgot-success" id="forgot-success">
              <span>&#x2714;</span> Reset request sent. Your administrator will contact you.
            </div>
          </div>
        </div>
      </div>

      <div class="login-hint">Authorized AMCOEE personnel only</div>
    </div>
  </div>
</div>

<!-- ═══════════════════ APP SHELL (hidden until authenticated) ═══════════════════ -->
<div id="app-shell" style="display:none"></div>

<!-- ═══════════════════ SCRIPTS ═══════════════════ -->
<!-- Foundation -->
<script src="js/event-bus.js"></script>

<script src="js/tools/fleet-mgr.js"></script>

<script src="js/tools/invoicing.js"></script>
<script src="js/tools/expense-mgr.js"></script>
<script src="js/tools/payroll-mgr.js"></script>

<script>
/* ══════════════════════════════════════════════════════════════════════════════
   AMCOEE Tools — Single-File Boot
   Handles: login page, login success → app mount, hash routing dispatch.
   ══════════════════════════════════════════════════════════════════════════════ */
(function() {
  'use strict';

  Theme.init();

  // Start Liquid Glass specular tracking (no-op if reduced-motion)
  if (typeof LiquidGlass !== 'undefined' && LiquidGlass.init) {
    LiquidGlass.init();
  }

  // ══════════════════════════════════════════════════════════════════════════
  // LOGIN PAGE UI
  // ══════════════════════════════════════════════════════════════════════════

  var card = document.getElementById('login-card');

  // Tagline is static on an Apple-style login — no typing animation.
  var taglineEl = document.getElementById('tagline');
  if (taglineEl) taglineEl.textContent = 'Employee Portal \u2014 AMCO Electric & Energy';

  function createRipple(e) {
    var button = e.currentTarget;
    var rect = button.getBoundingClientRect();
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    button.appendChild(ripple);
    ripple.addEventListener('animationend', function() { ripple.remove(); });
  }

  var selectedUserId = null;

  function renderLoginUsers() {
    var users = Auth.getUsers();
    var container = document.getElementById('user-list');
    container.innerHTML = '';
    users.forEach(function(u) {
      var roleConfig = Auth.getRoleConfig(u.role);
      var btn = document.createElement('button');
      btn.className = 'login-user-btn';
      btn.setAttribute('type', 'button');
      btn.innerHTML =
        '<div class="login-user-avatar" style="background:' + roleConfig.color + '">' + u.avatar + '</div>' +
        '<div class="login-user-info">' +
          '<div class="login-user-name">' + u.name + '</div>' +
          '<div class="login-user-role" style="color:' + roleConfig.color + '">' + roleConfig.label + '</div>' +
        '</div>' +
        '<svg class="login-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
      btn.addEventListener('click', function() { selectUser(u); });
      container.appendChild(btn);
    });
  }

  var stepUser = document.getElementById('login-step-user');
  var stepPin = document.getElementById('login-step-pin');
  var stepForgot = document.getElementById('login-step-forgot');

  function selectUser(user) {
    selectedUserId = user.id;
    stepUser.classList.add('step-slide-out');
    setTimeout(function() {
      stepUser.style.display = 'none';
      stepUser.classList.remove('step-slide-out');
      stepPin.style.display = 'block';
      stepPin.classList.add('step-slide-in');
      document.getElementById('pin-user-name').textContent = user.name;
      clearPinBoxes();
      pinBoxes[0].focus();
      document.getElementById('login-error').style.display = 'none';
      document.getElementById('login-btn').disabled = true;
      var lockoutEl = document.getElementById('lockout-msg');
      if (Auth.isLockedOut(user.id)) {
        document.getElementById('lockout-text').textContent = 'Account temporarily locked due to failed attempts.';
        lockoutEl.style.display = 'block';
        startLockoutTimer();
      } else {
        lockoutEl.style.display = 'none';
      }
      setTimeout(function() { stepPin.classList.remove('step-slide-in'); }, 400);
    }, 350);
  }

  document.getElementById('back-to-users').addEventListener('click', function() {
    selectedUserId = null;
    stepPin.classList.add('step-slide-back-out');
    setTimeout(function() {
      stepPin.style.display = 'none';
      stepPin.classList.remove('step-slide-back-out');
      stepUser.style.display = 'block';
      stepUser.classList.add('step-slide-back-in');
      setTimeout(function() { stepUser.classList.remove('step-slide-back-in'); }, 400);
    }, 350);
  });

  var pinBoxes = document.querySelectorAll('.pin-box');

  pinBoxes.forEach(function(box, i) {
    box.addEventListener('input', function() {
      var val = box.value.replace(/\D/g, '');
      box.value = val.charAt(0) || '';
      if (box.value) {
        box.classList.add('filled');
        if (i < pinBoxes.length - 1) pinBoxes[i + 1].focus();
      } else {
        box.classList.remove('filled');
      }
      updateLoginButton();
    });

    box.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !box.value && i > 0) {
        pinBoxes[i - 1].focus();
        pinBoxes[i - 1].value = '';
        pinBoxes[i - 1].classList.remove('filled');
        updateLoginButton();
        e.preventDefault();
      }
      if (e.key === 'Enter') attemptLogin();
    });

    box.addEventListener('paste', function(e) {
      e.preventDefault();
      var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      for (var j = 0; j < pinBoxes.length && j < paste.length; j++) {
        pinBoxes[j].value = paste.charAt(j);
        pinBoxes[j].classList.add('filled');
      }
      var focusIdx = Math.min(paste.length, pinBoxes.length - 1);
      pinBoxes[focusIdx].focus();
      updateLoginButton();
    });

    box.addEventListener('keypress', function(e) {
      if (!/\d/.test(e.key) && e.key !== 'Enter') e.preventDefault();
    });
  });

  function getPin() {
    var pin = '';
    pinBoxes.forEach(function(b) { pin += b.value; });
    return pin;
  }

  function clearPinBoxes() {
    pinBoxes.forEach(function(b) {
      b.value = '';
      b.classList.remove('filled');
    });
  }

  function updateLoginButton() {
    document.getElementById('login-btn').disabled = getPin().length < 4;
  }

  var lockoutInterval = null;

  function startLockoutTimer() {
    var timerEl = document.getElementById('lockout-timer');
    if (lockoutInterval) clearInterval(lockoutInterval);
    lockoutInterval = setInterval(function() {
      if (!selectedUserId || !Auth.isLockedOut(selectedUserId)) {
        timerEl.textContent = '';
        document.getElementById('lockout-msg').style.display = 'none';
        clearInterval(lockoutInterval);
        lockoutInterval = null;
        return;
      }
      timerEl.textContent = 'Please wait before trying again...';
    }, 1000);
  }

  var loginBtn = document.getElementById('login-btn');

  loginBtn.addEventListener('click', function(e) {
    createRipple(e);
    attemptLogin();
  });

  function attemptLogin() {
    var pin = getPin();
    if (pin.length < 4 || !selectedUserId) return;
    loginBtn.classList.add('loading');
    loginBtn.disabled = true;
    setTimeout(function() {
      var result = Auth.login(selectedUserId, pin);
      if (result.success) {
        loginBtn.classList.remove('loading');
        card.classList.add('success');
        setTimeout(function() { showApp(result.session); }, 700);
      } else {
        loginBtn.classList.remove('loading');
        var errEl = document.getElementById('login-error');
        errEl.textContent = result.error;
        errEl.style.display = 'block';
        errEl.style.animation = 'none';
        requestAnimationFrame(function() {
          errEl.style.animation = 'errorBounceIn 400ms cubic-bezier(0.16, 1, 0.3, 1) forwards';
        });
        var pinContainer = document.getElementById('pin-boxes');
        pinContainer.classList.add('shake-it');
        setTimeout(function() { pinContainer.classList.remove('shake-it'); }, 500);
        clearPinBoxes();
        pinBoxes[0].focus();
        loginBtn.disabled = true;
        if (result.error && result.error.toLowerCase().includes('locked')) {
          document.getElementById('lockout-text').textContent = result.error;
          document.getElementById('lockout-msg').style.display = 'block';
          document.getElementById('lockout-msg').style.animation = 'none';
          requestAnimationFrame(function() {
            document.getElementById('lockout-msg').style.animation = 'errorBounceIn 400ms cubic-bezier(0.16, 1, 0.3, 1) forwards';
          });
          startLockoutTimer();
        }
      }
    }, 400);
  }

  document.getElementById('forgot-pin-link').addEventListener('click', function() {
    stepPin.classList.add('step-slide-out');
    setTimeout(function() {
      stepPin.style.display = 'none';
      stepPin.classList.remove('step-slide-out');
      stepForgot.style.display = 'block';
      stepForgot.classList.add('step-slide-in');
      var resetBtn = document.getElementById('request-reset-btn');
      resetBtn.disabled = false;
      resetBtn.querySelector('.btn-text').textContent = 'Request Reset';
      document.getElementById('forgot-success').classList.remove('visible');
      setTimeout(function() { stepForgot.classList.remove('step-slide-in'); }, 400);
    }, 350);
  });

  document.getElementById('back-to-pin').addEventListener('click', function() {
    stepForgot.classList.add('step-slide-back-out');
    setTimeout(function() {
      stepForgot.style.display = 'none';
      stepForgot.classList.remove('step-slide-back-out');
      stepPin.style.display = 'block';
      stepPin.classList.add('step-slide-back-in');
      clearPinBoxes();
      pinBoxes[0].focus();
      setTimeout(function() { stepPin.classList.remove('step-slide-back-in'); }, 400);
    }, 350);
  });

  document.getElementById('request-reset-btn').addEventListener('click', function(e) {
    createRipple(e);
    var resetBtn = document.getElementById('request-reset-btn');
    if (typeof AuditLog !== 'undefined' && AuditLog.log) {
      AuditLog.log('pin_reset_request', { userId: selectedUserId });
    }
    resetBtn.disabled = true;
    resetBtn.querySelector('.btn-text').textContent = 'Request Sent \u2713';
    document.getElementById('forgot-success').classList.add('visible');
  });

  // ══════════════════════════════════════════════════════════════════════════
  // DISPATCH TABLE — hash slug → { pageId, title, render(main, session) }
  // Future-split: each entry maps 1:1 to a future <slug>.html file.
  // ══════════════════════════════════════════════════════════════════════════

  var DISPATCH = {
    'command-center': { pageId: 'command-center', title: 'Command Center',        render: function(main, session) { OwnerDashboard.render(main, session); } },
    'dashboard':      { pageId: 'dashboard',      title: 'Dashboard',             render: function(main, session) { EnhancedDashboard.render(); } },
    'jobs':           { pageId: 'jobs',           title: 'Job Board',             render: function(main, session) { JobBoard.render(main, session); } },
    'schedule':       { pageId: 'scheduling',     title: 'Scheduling',            render: function(main, session) { Scheduling.render(main, session); } },
    'timeclock':      { pageId: 'timeclock',      title: 'Time Clock',            render: function(main, session) { TimeClock.render(main, session); } },
    'tools':          { pageId: 'tool-tracker',   title: 'Tool Tracker',          render: function(main, session) { ToolTracker.render(main, session); } },
    'inventory':      { pageId: 'inventory',      title: 'Inventory',             render: function(main, session) { InventoryManager.render(main, session); } },
    'fleet':          { pageId: 'fleet',          title: 'Fleet Management',      render: function(main, session) { FleetManager.render(main, session); } },
    'crm':            { pageId: 'crm',            title: 'Customers',             render: function(main, session) { CRM.render(main, session); } },
    'invoicing':      { pageId: 'invoicing',      title: 'Invoicing',             render: function(main, session) { Invoicing.render(main, session); } },
    'expenses':       { pageId: 'expenses',       title: 'Expenses',              render: function(main, session) { ExpenseManager.render(main, session); } },
    'payroll':        { pageId: 'payroll',        title: 'Payroll',               render: function(main, session) { PayrollManager.render(main, session); } },
    'announcements':  { pageId: 'announcements',  title: 'Announcements',         render: function(main, session) { Announcements.render(main, session); } },
    'documents':      { pageId: 'documents',      title: 'Documents',             render: function(main, session) { Documents.render(main, session); } },
    'safety':         { pageId: 'safety',         title: 'Safety',                render: function(main, session) { SafetyManager.render(main, session); } },
    'reports':        { pageId: 'reporting',      title: 'Reports & Analytics',   render: function(main, session) { ReportBuilder.render(); } },
    'employees':      { pageId: 'employees',      title: 'Employee Management',   render: function(main, session) { OrgManager.renderEmployees(main, session); } },
    'profile':        { pageId: 'profile',        title: 'My Profile',            render: function(main, session) { Profile.render(main, session); } },
    'settings':       { pageId: 'settings',       title: 'Settings',              render: renderSettingsPage }
  };

  // Settings page has complex tab state; keep it inline.
  function renderSettingsPage(main, session) {
    var isAdmin = session.role === 'owner' || session.role === 'head_admin';
    var activeTab = 'departments';

    function render() {
      var tabs = [
        { id: 'departments', label: 'Departments',    admin: true },
        { id: 'groups',      label: 'Groups',         admin: true },
        { id: 'orgchart',    label: 'Org Chart',      admin: true },
        { id: 'data',        label: 'Data & Storage', admin: true }
      ];
      var visibleTabs = tabs.filter(function(t) { return !t.admin || isAdmin; });

      main.innerHTML =
        '<div style="margin-bottom:24px">' +
          '<h2 style="font-size:var(--text-2xl);font-weight:800;color:var(--text-primary);font-family:var(--font-display)">Settings</h2>' +
          '<p style="color:var(--text-secondary);font-size:var(--text-sm);margin-top:4px">Organization and system configuration</p>' +
        '</div>' +
        '<div style="display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border-primary)">' +
          visibleTabs.map(function(t) {
            var active = activeTab === t.id;
            return '<button class="btn btn-ghost btn-sm settings-tab" data-tab="' + t.id + '" style="' +
              (active ? 'color:var(--accent);border-bottom:2px solid var(--accent);border-radius:0' : '') +
              '">' + t.label + '</button>';
          }).join('') +
        '</div>' +
        '<div id="settings-content"></div>';

      main.querySelectorAll('.settings-tab').forEach(function(btn) {
        btn.addEventListener('click', function() {
          activeTab = btn.dataset.tab;
          render();
        });
      });

      var content = document.getElementById('settings-content');
      if (activeTab === 'departments')      OrgManager.renderDepartments(content, session);
      else if (activeTab === 'groups')      OrgManager.renderGroups(content, session);
      else if (activeTab === 'orgchart')    OrgManager.renderOrgChart(content, session);
      else if (activeTab === 'data')        renderDataSettings(content);
    }

    function renderDataSettings(container) {
      var usage = DataStore.getStorageUsage();
      container.innerHTML =
        '<div class="card" style="padding:24px;margin-bottom:16px">' +
          '<h3 style="font-weight:700;margin-bottom:16px">Storage Usage</h3>' +
          '<div style="display:grid;gap:12px">' +
            '<div style="display:flex;justify-content:space-between"><span style="color:var(--text-secondary)">localStorage</span><span style="font-family:var(--font-mono)">' + usage.localStorageMB + ' MB (' + usage.localStoragePercent + '%)</span></div>' +
            '<div class="progress" style="margin-top:4px"><div class="progress-fill" style="width:' + Math.min(usage.localStoragePercent, 100) + '%"></div></div>' +
          '</div>' +
        '</div>' +
        '<div class="card" style="padding:24px">' +
          '<h3 style="font-weight:700;margin-bottom:16px">Data Management</h3>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
            '<button class="btn btn-primary btn-sm" id="btn-export-data">Export All Data</button>' +
            '<button class="btn btn-ghost btn-sm" id="btn-import-data">Import Data</button>' +
          '</div>' +
        '</div>';

      container.querySelector('#btn-export-data').addEventListener('click', async function() {
        var dump = await DataStore.exportAll();
        var blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'amcoee-backup-' + new Date().toISOString().split('T')[0] + '.json';
        a.click();
        URL.revokeObjectURL(url);
        UI.toast('Data exported', 'success');
      });

      container.querySelector('#btn-import-data').addEventListener('click', function() {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.addEventListener('change', async function() {
          var file = input.files[0];
          if (!file) return;
          try {
            var text = await file.text();
            var data = JSON.parse(text);
            await DataStore.importAll(data);
            UI.toast('Data imported successfully', 'success');
            render();
          } catch (e) {
            UI.toast('Import failed: ' + e.message, 'error');
          }
        });
        input.click();
      });
    }

    render();
  }

  // ══════════════════════════════════════════════════════════════════════════
  // APP MOUNT & ROUTING
  // ══════════════════════════════════════════════════════════════════════════

  function defaultSlugForRole(role) {
    return (role === 'owner' || role === 'head_admin') ? 'command-center' : 'dashboard';
  }

  function currentSlug(session) {
    var slug = (window.location.hash || '').replace(/^#/, '');
    if (slug && DISPATCH[slug]) return slug;
    return defaultSlugForRole(session.role);
  }

  function showApp(session) {
    document.getElementById('login-screen').style.display = 'none';
    var appShell = document.getElementById('app-shell');
    appShell.style.display = '';

    // Determine the slug to mount first
    var slug = currentSlug(session);
    var entry = DISPATCH[slug];

    // Set the hash if not already set
    if (window.location.hash.replace(/^#/, '') !== slug) {
      // Use replaceState so we don't push an extra history entry
      try {
        history.replaceState(null, '', '#' + slug);
      } catch (e) {
        window.location.hash = slug;
      }
    }

    // Build the shell (sidebar + header + empty main-body)
    Shell.init({ pageId: entry.pageId, pageTitle: entry.title });

    // Register all routes with the router (keys are hash slugs)
    Object.keys(DISPATCH).forEach(function(s) {
      var d = DISPATCH[s];
      Router.register(s, function() {
        var main = document.getElementById('main-body');
        if (!main) return;
        try { d.render(main, session); } catch (e) { console.error('[Router] render ' + s + ' failed:', e); }
        document.title = d.title + ' — AMCOEE Tools';
        Shell.setActivePage(d.pageId);
        // Re-bind 3D tilt + scroll-reveal to newly mounted content
        if (typeof CardTilt !== 'undefined') {
          if (CardTilt.applyTilt) CardTilt.applyTilt(main);
          if (CardTilt.initScrollReveal) CardTilt.initScrollReveal(main);
        }
      });
    });

    Router.init();
  }

  // ══════════════════════════════════════════════════════════════════════════
  // BOOT
  // ══════════════════════════════════════════════════════════════════════════

  // Run schema migrations on load
  if (typeof SchemaMigrations !== 'undefined') {
    SchemaMigrations.run().then(function(result) {
      if (result && result.migrated) console.info('[Boot] Migrations applied, now at schema v' + result.version);
    }).catch(function(e) { console.error('[Boot] Migration error:', e); });
  }

  var existingSession = Auth.getSession();
  if (existingSession) {
    showApp(existingSession);
  } else {
    renderLoginUsers();
  }

})();
</script>

</body>
</html>
