<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AMCOEE Tools</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <!-- Security & Utility Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ==" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <link rel="stylesheet" href="css/design-system.css"/>
  <style>
    /* ── Login Page ─────────────────────────────────────────────────── */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }
    .login-bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border-subtle) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-subtle) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 100%);
    }
    .login-glow {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: var(--accent-glow);
      filter: blur(120px);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.3;
      animation: float 6s ease-in-out infinite;
    }
    .login-card {
      position: relative;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-xl);
      animation: fadeInScale 600ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo-icon {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      background: var(--accent-subtle);
      border: 1px solid var(--accent);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      animation: float 4s ease-in-out infinite;
    }
    .login-logo h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .login-logo h1 span { color: var(--accent); }
    .login-logo p {
      color: var(--text-tertiary);
      font-size: 0.875rem;
      margin-top: 4px;
    }
    .login-users {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }
    .login-user-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
      text-align: left;
      color: var(--text-primary);
    }
    .login-user-btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-secondary);
      transform: translateX(4px);
    }
    .login-user-btn.selected {
      border-color: var(--accent);
      background: var(--accent-subtle);
    }
    .login-user-avatar {
      width: 40px; height: 40px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8125rem;
      color: white;
      flex-shrink: 0;
    }
    .login-user-info { flex: 1; }
    .login-user-name { font-weight: 600; font-size: 0.9375rem; }
    .login-user-role {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pin-input-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
    .pin-digit {
      width: 52px; height: 60px;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-primary);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      outline: none;
      caret-color: var(--accent);
      transition: border-color 200ms, box-shadow 200ms;
    }
    .pin-digit:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    .pin-digit.filled {
      border-color: var(--accent);
      color: var(--accent);
    }
    .pin-input-single {
      width: 100%;
      max-width: 240px;
      margin: 20px auto;
      display: block;
      padding: 16px;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-primary);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.5em;
      color: var(--text-primary);
      outline: none;
      caret-color: var(--accent);
      transition: border-color 200ms, box-shadow 200ms;
    }
    .pin-input-single:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
    }
    .lockout-message {
      text-align: center;
      padding: 12px 16px;
      background: var(--status-error-bg);
      border: 1px solid var(--status-error);
      border-radius: var(--radius-md);
      color: var(--status-error);
      font-size: 0.8125rem;
      font-weight: 600;
      margin-top: 12px;
      animation: fadeInUp 300ms ease both;
    }
    .login-error {
      text-align: center;
      color: var(--status-error);
      font-size: 0.8125rem;
      font-weight: 600;
      margin-top: 8px;
      animation: fadeInUp 300ms ease both;
    }
    .login-hint {
      text-align: center;
      color: var(--text-tertiary);
      font-size: 0.75rem;
      margin-top: 16px;
    }

    /* ── App Shell ──────────────────────────────────────────────────── */
    #app-shell { display: none; }
    #login-screen { display: block; }

    .sidebar-logo-text {
      font-size: 1.0625rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sidebar-logo-text span { color: var(--accent); }

    .header-user {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      transition: background 150ms;
    }
    .header-user:hover { background: var(--bg-hover); }
    .header-user-info { text-align: right; }
    .header-user-name { font-size: var(--text-sm); font-weight: 600; }
    .header-user-role { font-size: var(--text-xs); color: var(--text-tertiary); }

    .theme-toggle {
      width: 36px; height: 36px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-primary);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 200ms;
      font-size: 16px;
    }
    .theme-toggle:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
      color: var(--accent);
    }

    .mobile-menu-btn {
      display: none;
      width: 36px; height: 36px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-primary);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    @media (max-width: 768px) {
      .mobile-menu-btn { display: flex; }
      .header-user-info { display: none; }
    }

    /* Page title area */
    .page-title-area { display: flex; align-items: center; gap: var(--space-3); }
    .page-title { font-size: var(--text-xl); font-weight: 800; letter-spacing: -0.02em; }
    .page-subtitle { font-size: var(--text-sm); color: var(--text-tertiary); }

    /* Quick action grid on dashboard */
    .quick-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-5) var(--space-3);
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }
    .quick-action:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .quick-action-icon {
      width: 48px; height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: var(--accent-subtle);
      transition: transform 250ms;
    }
    .quick-action:hover .quick-action-icon { transform: scale(1.1); }
    .quick-action-label { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); }
    .quick-action-desc { font-size: var(--text-xs); color: var(--text-tertiary); }
  </style>
</head>
<body>

<!-- ═══════════════════ LOGIN SCREEN ═══════════════════ -->
<div id="login-screen">
  <div class="login-wrapper">
    <div class="login-bg-grid"></div>
    <div class="login-glow"></div>
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">⚡</div>
        <h1><span>AMCOEE</span> Tools</h1>
        <p>Employee Portal &mdash; AMCO Electric &amp; Energy</p>
      </div>

      <div id="login-step-user">
        <label class="input-label" style="margin-bottom:12px">Select your account</label>
        <div class="login-users" id="user-list"></div>
      </div>

      <div id="login-step-pin" style="display:none">
        <button class="btn btn-ghost" id="back-to-users" style="margin-bottom:12px;padding:4px 0;font-size:0.8125rem">
          &larr; Back to users
        </button>
        <div style="text-align:center;margin-bottom:8px">
          <span id="pin-user-name" style="font-weight:700;font-size:1rem"></span>
        </div>
        <label class="input-label" style="text-align:center;margin-bottom:4px">Enter your PIN</label>
        <input type="password" id="pin-input" class="pin-input-single" inputmode="numeric" autocomplete="off" placeholder="------" maxlength="8"/>
        <div id="login-error" class="login-error" style="display:none"></div>
        <div id="lockout-msg" class="lockout-message" style="display:none"></div>
        <button class="btn btn-primary btn-full btn-lg" id="login-btn" style="margin-top:16px" disabled>
          Sign In
        </button>
      </div>

      <div class="login-hint">
        Authorized AMCOEE personnel only
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════ APP SHELL ═══════════════════ -->
<div id="app-shell">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div style="font-size:22px">⚡</div>
      <div class="sidebar-logo-text"><span>AMCOEE</span> Tools</div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div style="padding:var(--space-3);border-top:1px solid var(--border-primary)">
      <div class="sidebar-link" id="sidebar-logout" style="color:var(--status-error)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <header class="main-header">
      <div class="flex items-center gap-3">
        <button class="mobile-menu-btn" onclick="UI.toggleSidebar()">☰</button>
        <div class="page-title-area">
          <h2 class="page-title" id="page-title">Dashboard</h2>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>
        <div class="header-user" id="header-user">
          <div class="header-user-info">
            <div class="header-user-name" id="header-user-name"></div>
            <div class="header-user-role" id="header-user-role"></div>
          </div>
          <div class="avatar" id="header-avatar" style="background:var(--accent)"></div>
        </div>
      </div>
    </header>
    <div class="main-body" id="main-body"></div>
  </div>
</div>

<!-- ═══════════════════ SCRIPTS ═══════════════════ -->

<script src="js/theme.js"></script>
<script src="js/router.js"></script>
<script src="js/ui.js"></script>

    ]},
  ];

  // ── Render Login ────────────────────────────────────────────────────────
  let selectedUserId = null;

  function renderLoginUsers() {
    const users = Auth.getUsers();
    const container = document.getElementById('user-list');
    container.innerHTML = '';
    users.forEach((u, i) => {
      const roleConfig = Auth.getRoleConfig(u.role);
      const btn = document.createElement('button');
      btn.className = 'login-user-btn';
      btn.style.animationDelay = (i * 60) + 'ms';
      btn.classList.add('animate-fade-in-up');
      btn.innerHTML = `
        <div class="login-user-avatar" style="background:${roleConfig.color}">${u.avatar}</div>
        <div class="login-user-info">
          <div class="login-user-name">${u.name}</div>
          <div class="login-user-role" style="color:${roleConfig.color}">${roleConfig.label}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-tertiary)"><polyline points="9 18 15 12 9 6"/></svg>
      `;
      btn.addEventListener('click', () => selectUser(u));
      container.appendChild(btn);
    });
  }

  function selectUser(user) {
    selectedUserId = user.id;
    document.getElementById('login-step-user').style.display = 'none';
    document.getElementById('login-step-pin').style.display = 'block';
    document.getElementById('pin-user-name').textContent = user.name;
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').focus();
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-btn').disabled = true;

    const lockoutEl = document.getElementById('lockout-msg');
    if (Auth.isLockedOut(user.id)) {
      lockoutEl.textContent = 'Account temporarily locked due to failed attempts.';
      lockoutEl.style.display = 'block';
    } else {
      lockoutEl.style.display = 'none';
    }
  }

  document.getElementById('back-to-users').addEventListener('click', () => {
    selectedUserId = null;
    document.getElementById('login-step-user').style.display = 'block';
    document.getElementById('login-step-pin').style.display = 'none';
  });

  // PIN input logic (single input)
  const pinInput = document.getElementById('pin-input');
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '');
    document.getElementById('login-btn').disabled = pinInput.value.length < 4;
  });
  pinInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') attemptLogin();
  });

  function attemptLogin() {
    const pin = document.getElementById('pin-input').value;
    if (pin.length < 4 || !selectedUserId) return;

    const result = Auth.login(selectedUserId, pin);
    if (result.success) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-shell').style.display = 'block';
      initApp(result.session);
    } else {
      const errEl = document.getElementById('login-error');
      errEl.textContent = result.error;
      errEl.style.display = 'block';
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-input').focus();
      document.getElementById('login-btn').disabled = true;
      // Shake
      const card = document.querySelector('.login-card');
      card.style.animation = 'none';
      requestAnimationFrame(() => { card.style.animation = 'shake 400ms ease'; });
      // Check lockout
      if (result.error.includes('locked')) {
        document.getElementById('lockout-msg').textContent = result.error;
        document.getElementById('lockout-msg').style.display = 'block';
      }
    }
  }

  document.getElementById('login-btn').addEventListener('click', attemptLogin);

  // Shake keyframe
  const shakeStyle = document.createElement('style');
  shakeStyle.textContent = `@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }`;
  document.head.appendChild(shakeStyle);

  // ── Initialize App ──────────────────────────────────────────────────────
  function initApp(session) {
    const prefs = Auth.getPrefs(session.userId);
    Theme.apply(prefs);

    // Header
    document.getElementById('header-user-name').textContent = session.name;
    document.getElementById('header-user-role').textContent = Auth.getRoleConfig(session.role).label;
    document.getElementById('header-avatar').textContent = session.avatar;
    document.getElementById('header-avatar').style.background = Auth.getRoleConfig(session.role).color;

    // Theme toggle
    const themeBtn = document.getElementById('theme-toggle');
    themeBtn.textContent = prefs.theme === 'dark' ? '🌙' : '☀️';
    themeBtn.addEventListener('click', () => {
      const next = Theme.toggle();
      themeBtn.textContent = next === 'dark' ? '🌙' : '☀️';
      Auth.savePrefs(session.userId, { theme: next });
    });

    // Sidebar logout
    document.getElementById('sidebar-logout').addEventListener('click', () => Auth.logout());

    // Build sidebar nav
    buildSidebar(session);

    // Register routes
    registerRoutes(session);

    // Start heartbeat for session timeout
    Auth.startHeartbeat();

    // Start router — default to owner-dashboard for owner/head_admin
    Router.onNavigate((route) => {
      document.getElementById('page-title').textContent = getPageTitle(route);
      document.querySelectorAll('.sidebar-link').forEach(el => {
        el.classList.toggle('active', el.dataset.route === route);
      });
    });

    if (!window.location.hash && PermissionGuard.hasOwnerDashboard(session.role)) {
      window.location.hash = 'owner-dashboard';
    }
    Router.init();
  }

  function buildSidebar(session) {
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = '';

    NAV_ITEMS.forEach(section => {
      const visibleItems = section.items.filter(item => Auth.hasPermission(item.perm));
      if (visibleItems.length === 0) return;

      const sectionEl = document.createElement('div');
      sectionEl.className = 'sidebar-section';
      sectionEl.innerHTML = `<div class="sidebar-section-title">${section.section}</div>`;

      visibleItems.forEach(item => {
        const link = document.createElement('div');
        link.className = 'sidebar-link';
        link.dataset.route = item.id;
        link.innerHTML = `${item.icon}<span>${item.label}</span>`;
        link.addEventListener('click', () => {
          Router.navigate(item.id);
          document.getElementById('sidebar').classList.remove('open');
        });
        sectionEl.appendChild(link);
      });

      nav.appendChild(sectionEl);
    });
  }

  function getPageTitle(route) {
    const titles = {
      'owner-dashboard': 'Command Center',
      'dashboard': 'Dashboard',
      'jobs': 'Job Board',
      'scheduling': 'Scheduling',
      'timeclock': 'Time Clock',
      'tool-tracker': 'Tool Tracker',
      'inventory': 'Inventory & Materials',
      'fleet': 'Fleet Management',
      'crm': 'Customers',
      'invoicing': 'Estimates & Invoicing',
      'expenses': 'Expense Tracking',
      'announcements': 'Announcements',
      'documents': 'Document Hub',
      'safety': 'Safety & Compliance',
      'reporting': 'Reports & Analytics',
      'employees': 'Employee Management',
      'payroll': 'Payroll',
      'settings': 'Settings',
    };
    return titles[route] || 'AMCOEE Tools';
  }

  // ── Route Handlers ──────────────────────────────────────────────────────
  function registerRoutes(session) {
    const main = document.getElementById('main-body');

    Router.register('owner-dashboard', () => renderPlaceholder(main, 'Command Center', 'Owner dashboard with real-time analytics, approval queue, and company overview.', '👑'));
    Router.register('dashboard', () => renderDashboard(main, session));
    Router.register('jobs', () => renderPlaceholder(main, 'Job Board', 'Manage active jobs, dispatch crews, and track progress.', '📂'));
    Router.register('scheduling', () => renderPlaceholder(main, 'Scheduling', 'Calendar view of jobs, crews, and assignments.', '📅'));
    Router.register('timeclock', () => renderPlaceholder(main, 'Time Clock', 'Clock in/out, view timesheets, manage hours.', '⏰'));
    Router.register('tool-tracker', () => renderPlaceholder(main, 'Tool Tracker', 'Track tools, check in/out, QR scanning, condition reports.', '🔧'));
    Router.register('inventory', () => renderPlaceholder(main, 'Inventory & Materials', 'Track materials, request supplies, manage stock levels.', '📦'));
    Router.register('fleet', () => renderPlaceholder(main, 'Fleet Management', 'Vehicle assignments, maintenance schedules, mileage tracking.', '🚛'));
    Router.register('crm', () => renderPlaceholder(main, 'Customers', 'Client database, contact info, job history, notes.', '👥'));
    Router.register('invoicing', () => renderPlaceholder(main, 'Estimates & Invoicing', 'Create estimates, generate invoices, track payments.', '💰'));
    Router.register('expenses', () => renderPlaceholder(main, 'Expense Tracking', 'Submit and approve expense reports, receipts, mileage.', '💳'));
    Router.register('announcements', () => renderPlaceholder(main, 'Announcements', 'Company-wide announcements, alerts, and updates.', '🔔'));
    Router.register('documents', () => renderPlaceholder(main, 'Document Hub', 'Permits, plans, manuals, certifications, and compliance docs.', '📄'));
    Router.register('safety', () => renderPlaceholder(main, 'Safety & Compliance', 'Safety protocols, incident reports, training records.', '🛡️'));
    Router.register('reporting', () => renderPlaceholder(main, 'Reports & Analytics', 'Revenue, job metrics, labor costs, performance dashboards.', '📊'));
    Router.register('employees', () => renderPlaceholder(main, 'Employee Management', 'Manage team, roles, permissions, contact info.', '👤'));
    Router.register('payroll', () => renderPlaceholder(main, 'Payroll', 'Payroll processing, pay stubs, tax documents.', '💼'));
    Router.register('settings', () => renderSettings(main, session));
    Router.register('404', () => renderPlaceholder(main, 'Page Not Found', 'This page does not exist.', '❓'));
  }

  // ── Dashboard ───────────────────────────────────────────────────────────
  function renderDashboard(container, session) {
    const role = session.role;
    const now = new Date();
    const greeting = now.getHours() < 12 ? 'Good morning' : now.getHours() < 18 ? 'Good afternoon' : 'Good evening';

    let statsHTML = '';
    if (role === 'admin' || role === 'office' || role === 'owner' || role === 'head_admin') {
      statsHTML = `
        <div class="grid grid-4 stagger-children" style="margin-bottom:var(--space-6)">
          <div class="stat-card">
            <div class="stat-card-icon" style="background:var(--status-success-bg);color:var(--status-success)">📂</div>
            <div class="stat-card-value">12</div>
            <div class="stat-card-label">Active Jobs</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon" style="background:var(--status-info-bg);color:var(--status-info)">👥</div>
            <div class="stat-card-value">8</div>
            <div class="stat-card-label">Crew Members</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon" style="background:var(--status-warning-bg);color:var(--status-warning)">🔧</div>
            <div class="stat-card-value">24</div>
            <div class="stat-card-label">Tools Tracked</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon" style="background:var(--accent-subtle);color:var(--accent)">💰</div>
            <div class="stat-card-value">$48.2K</div>
            <div class="stat-card-label">Revenue MTD</div>
          </div>
        </div>`;
    } else {
      statsHTML = `
        <div class="grid grid-3 stagger-children" style="margin-bottom:var(--space-6)">
          <div class="stat-card">
            <div class="stat-card-icon" style="background:var(--status-success-bg);color:var(--status-success)">📂</div>
            <div class="stat-card-value">3</div>
            <div class="stat-card-label">My Active Jobs</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon" style="background:var(--status-info-bg);color:var(--status-info)">⏰</div>
            <div class="stat-card-value">7.5h</div>
            <div class="stat-card-label">Hours Today</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon" style="background:var(--status-warning-bg);color:var(--status-warning)">🔧</div>
            <div class="stat-card-value">4</div>
            <div class="stat-card-label">Tools Checked Out</div>
          </div>
        </div>`;
    }

    const allActions = [
      { id: 'jobs', icon: '📂', label: 'Job Board', desc: 'View & manage jobs', perm: 'jobs' },
      { id: 'timeclock', icon: '⏰', label: 'Clock In', desc: 'Start your shift', perm: 'timeclock' },
      { id: 'tool-tracker', icon: '🔧', label: 'Tool Tracker', desc: 'Check in/out tools', perm: 'tool-tracker' },
      { id: 'scheduling', icon: '📅', label: 'Schedule', desc: 'View calendar', perm: 'scheduling' },
      { id: 'crm', icon: '👥', label: 'Customers', desc: 'Client database', perm: 'crm' },
      { id: 'invoicing', icon: '💰', label: 'Invoicing', desc: 'Estimates & bills', perm: 'invoicing' },
      { id: 'inventory', icon: '📦', label: 'Inventory', desc: 'Materials & supplies', perm: 'inventory' },
      { id: 'safety', icon: '🛡️', label: 'Safety', desc: 'Protocols & reports', perm: 'safety' },
      { id: 'documents', icon: '📄', label: 'Documents', desc: 'Files & permits', perm: 'documents' },
      { id: 'fleet', icon: '🚛', label: 'Fleet', desc: 'Vehicles & mileage', perm: 'fleet' },
      { id: 'expenses', icon: '💳', label: 'Expenses', desc: 'Submit receipts', perm: 'expenses' },
      { id: 'announcements', icon: '🔔', label: 'News', desc: 'Company updates', perm: 'announcements' },
      { id: 'reporting', icon: '📊', label: 'Reports', desc: 'Analytics & metrics', perm: 'reporting' },
      { id: 'employees', icon: '👤', label: 'Employees', desc: 'Team management', perm: 'employees' },
      { id: 'settings', icon: '⚙️', label: 'Settings', desc: 'Preferences', perm: 'settings' },
    ];

    const visibleActions = allActions.filter(a => Auth.hasPermission(a.perm));

    const actionsHTML = visibleActions.map(a => `
      <div class="quick-action" onclick="Router.navigate('${a.id}')">
        <div class="quick-action-icon">${a.icon}</div>
        <div class="quick-action-label">${a.label}</div>
        <div class="quick-action-desc">${a.desc}</div>
      </div>
    `).join('');

    container.innerHTML = `
      <div class="page-enter">
        <div style="margin-bottom:var(--space-6)">
          <h2 style="font-size:var(--text-2xl);font-weight:800;letter-spacing:-0.02em">${greeting}, ${session.name.split(' ')[0]}</h2>
          <p style="color:var(--text-tertiary);margin-top:4px">${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</p>
        </div>
        ${statsHTML}
        <div style="margin-bottom:var(--space-4)">
          <h3 style="font-size:var(--text-base);font-weight:700;margin-bottom:var(--space-4)">Quick Actions</h3>
          <div class="grid grid-auto-fill stagger-children">
            ${actionsHTML}
          </div>
        </div>
      </div>
    `;
  }

  // ── Placeholder Pages ───────────────────────────────────────────────────
  function renderPlaceholder(container, title, desc, icon) {
    container.innerHTML = `
      <div class="page-enter" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center">
        <div style="font-size:64px;margin-bottom:24px;animation:float 3s ease-in-out infinite">${icon}</div>
        <h2 style="font-size:var(--text-2xl);font-weight:800;margin-bottom:8px">${title}</h2>
        <p style="color:var(--text-tertiary);max-width:400px;line-height:1.6">${desc}</p>
        <p style="color:var(--text-tertiary);font-size:var(--text-sm);margin-top:24px;padding:12px 20px;background:var(--bg-secondary);border:1px solid var(--border-primary);border-radius:var(--radius-md)">
          🚧 Coming soon — this tool is under development
        </p>
      </div>
    `;
  }

  // ── Settings Page ────────────────────────────────────────────────────────
  function renderSettings(container, session) {
    const prefs = Auth.getPrefs(session.userId);

    container.innerHTML = `
      <div class="page-enter">
        <div class="card" style="max-width:600px;margin-bottom:var(--space-5)">
          <h3 style="font-weight:700;margin-bottom:var(--space-5)">Appearance</h3>
          <div class="input-group">
            <label class="input-label">Theme</label>
            <div style="display:flex;gap:8px">
              <button class="btn ${prefs.theme === 'dark' ? 'btn-primary' : 'btn-secondary'}" id="theme-dark" style="flex:1">🌙 Dark</button>
              <button class="btn ${prefs.theme === 'light' ? 'btn-primary' : 'btn-secondary'}" id="theme-light" style="flex:1">☀️ Light</button>
            </div>
          </div>
          <div class="input-group">
            <label class="input-label">Accent Color</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap" id="accent-picker">
              ${Theme.ACCENT_PRESETS.map(c => `
                <button class="btn btn-icon" data-color="${c.value}" title="${c.name}"
                  style="width:40px;height:40px;background:${c.value};border-radius:var(--radius-full);border:3px solid ${c.value === prefs.accentColor ? 'white' : 'transparent'};transition:all 200ms">
                </button>
              `).join('')}
            </div>
          </div>
        </div>
        <div class="card" style="max-width:600px;margin-bottom:var(--space-5)">
          <h3 style="font-weight:700;margin-bottom:var(--space-5)">Account</h3>
          <div style="display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--border-primary)">
            <div class="avatar avatar-lg" style="background:${Auth.getRoleConfig(session.role).color}">${session.avatar}</div>
            <div>
              <div style="font-weight:700">${session.name}</div>
              <div style="color:var(--text-tertiary);font-size:var(--text-sm)">${session.email}</div>
              <span class="badge badge-info" style="margin-top:4px">${Auth.getRoleConfig(session.role).label}</span>
            </div>
          </div>
        </div>
        <div class="card" style="max-width:600px">
          <h3 style="font-weight:700;margin-bottom:var(--space-5);color:var(--status-error)">Danger Zone</h3>
          <button class="btn btn-danger" id="logout-btn">Sign Out</button>
        </div>
      </div>
    `;

    document.getElementById('theme-dark').addEventListener('click', () => {
      Auth.savePrefs(session.userId, { theme: 'dark' });
      Theme.apply({ ...prefs, theme: 'dark' });
      document.getElementById('theme-toggle').textContent = '🌙';
      renderSettings(container, session);
    });
    document.getElementById('theme-light').addEventListener('click', () => {
      Auth.savePrefs(session.userId, { theme: 'light' });
      Theme.apply({ ...prefs, theme: 'light' });
      document.getElementById('theme-toggle').textContent = '☀️';
      renderSettings(container, session);
    });
    document.getElementById('accent-picker').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-color]');
      if (!btn) return;
      const color = btn.dataset.color;
      Auth.savePrefs(session.userId, { accentColor: color });
      Theme.apply({ ...Auth.getPrefs(session.userId) });
      renderSettings(container, session);
      UI.toast('Accent color updated');
    });
    document.getElementById('logout-btn').addEventListener('click', () => Auth.logout());
  }

  // ── Auto-login check ───────────────────────────────────────────────────
  const existingSession = Auth.getSession();
  if (existingSession) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = 'block';
    initApp(existingSession);
  } else {
    renderLoginUsers();
  }

  // Init ripple effect
  UI.initRipples();

})();
</script>

</body>
</html>
